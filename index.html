<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google Tag (Google Tag Manager) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TQGGXMSV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>House Cookie</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- SEO -->
  <meta name="description" content="¡Hola soy House Cookie! Soy un tierno conejito de Cookie Run. Conoce mi perfil y mis redes sociales.">
  <meta name="author" content="House Cookie">
  <meta name="theme-color" content="#1acfea">

  <!-- Open Graph (al compartir el link) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="House Cookie">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="House Cookie">
  <meta property="og:description" content="¡Hola soy House Cookie! Soy un tierno conejito de Cookie Run. Conoce mi perfil y mis redes sociales.">
  <!-- Cuando subas la página, cambia esto por la URL completa, ej: https://tusitio.com/og-image.png -->
  <meta property="og:image" content="https://housethecookie.com/og-image.png">
  <meta property="og:image:alt" content="House Cookie">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="House Cookie">
  <meta name="twitter:description" content="¡Hola soy House Cookie! Soy un tierno conejito de Cookie Run. Conoce mi perfil y mis redes sociales.">
  <meta name="twitter:image" content="https://housethecookie.com/og-image.png">
  <style>
    /* Fuente personalizada (font.ttf junto al index.html) */
    @font-face {
      font-family: "HouseFont";
      src: url("font.ttf") format("truetype");
      font-weight: 100 900; /* evita que el navegador "engorde" la fuente */
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    /* Fondo de la página: capa fija que cubre TODA la pantalla,
       incluso debajo de la barra de estado y la barra inferior de iOS */
    .bg-layer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: -1;
      background-color: #017C00; /* Color de respaldo si no hay bg.png / bg.jpg */
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    body {
      min-height: 100vh;
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    /* ===== Botón de menú (arriba a la derecha) ===== */
    .menu-btn {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      width: 56px;
      height: 56px;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;

      /* Cuerpo azul-grisáceo con degradado */
      background: linear-gradient(180deg, #6c82a3 0%, #55698a 55%, #4a5d7c 100%);
      border: 3px solid #9fb2cf;
      border-radius: 14px;

      /* Borde oscuro exterior + brillo interior + sombra */
      box-shadow:
        0 0 0 2px #1d2738,
        inset 0 3px 0 rgba(255, 255, 255, 0.35),
        inset 0 -4px 0 rgba(20, 30, 50, 0.35),
        0 4px 8px rgba(0, 0, 0, 0.45);

      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-btn span {
      display: block;
      width: 28px;
      height: 5px;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .menu-btn:hover {
      filter: brightness(1.12);
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    /* ===== Menú desplegable (panel lateral derecho) ===== */
    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      max-width: 88vw;
      height: 100vh;
      background: #2c3748;
      box-shadow: -6px 0 18px rgba(0, 0, 0, 0.4);
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.28s ease, visibility 0.28s;
      z-index: 50;
    }

    .side-menu.open {
      transform: translateX(0);
      visibility: visible;
    }

    /* Franja oscura de arriba donde vive el botón */
    .side-menu-header {
      height: 88px;
      background: #1f2733;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    .side-menu-list {
      list-style: none;
      padding: 18px 26px 0;
      min-height: 330px;
      border-bottom: 2px solid #3a475b;
      margin: 0 22px;
      padding-left: 4px;
      padding-right: 4px;
    }

    .side-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 6px;
      color: #ffffff;
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.12s ease;
    }

    .side-menu-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .side-menu-item svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
    }

    /* El botón queda por encima del panel */
    .menu-btn {
      z-index: 100;
    }

    /* ===== Tarjeta de perfil (arriba a la izquierda) ===== */
    .profile-card {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
      display: flex;
      align-items: center;
      z-index: 40;
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    /* Parte principal */
    .profile-main {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 16px 7px 7px;
      background: linear-gradient(180deg, #4a5d7c 0%, #3d4f6b 100%);
      border: 3px solid #7f95b5;
      border-radius: 18px;
      box-shadow:
        0 0 0 2px #1d2738,
        inset 0 3px 0 rgba(255, 255, 255, 0.18),
        0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* Foto de perfil */
    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
      width: 72px;
      height: 72px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      border: 3px solid #d3dbe8;
      box-shadow: 0 0 0 3px #1d2738;
      background: linear-gradient(160deg, #6f86a8, #3f526f);
      overflow: hidden;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Botoncito circular con la flecha (esquina de la foto) */
    .expand-btn {
      position: relative;
      flex-shrink: 0;
      margin-left: 4px;
      width: 34px;
      height: 34px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(180deg, #e3e8ef 0%, #a9b4c4 100%);
      border: 2px solid #6b7a91;
      border-radius: 50%;
      box-shadow:
        0 0 0 2px #1d2738,
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 2px 4px rgba(0, 0, 0, 0.45);
      z-index: 3;
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .expand-btn svg {
      width: 15px;
      height: 15px;
      transition: transform 0.25s ease;
    }

    .expand-btn:hover {
      filter: brightness(1.1);
    }

    .expand-btn:active {
      transform: scale(0.92);
    }

    .profile-card.open .expand-btn svg {
      transform: rotate(180deg);
    }

    /* Textos del perfil */
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .profile-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      color: #e2bd8e;
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    .profile-title svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
    }

    .profile-divider {
      height: 2px;
      background: rgba(18, 26, 40, 0.55);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    /* Pedazo extra que se despliega (ID) */
    .profile-extra {
      position: relative;
      z-index: 1;
      max-width: 0;
      margin-left: -14px;
      overflow: hidden;
      opacity: 0;
      transition: max-width 0.3s ease, opacity 0.25s ease;
    }

    .profile-card.open .profile-extra {
      max-width: 260px;
      opacity: 1;
    }

    .profile-extra-inner {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 22px 0 32px;
      background: linear-gradient(180deg, #46587a 0%, #384a66 100%);
      border: 3px solid #7f95b5;
      border-left: none;
      border-radius: 0 16px 16px 0;
      box-shadow: 0 0 0 2px #1d2738, 0 4px 8px rgba(0, 0, 0, 0.35);
    }

    .profile-id {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }

    .profile-id:active {
      transform: scale(0.97);
    }

    /* ===== Cuadro central (biografía) ===== */
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 110px 16px 40px;
    }

    .dialog-wrap {
      position: relative;
      width: min(760px, 100%);
      transition: transform 0.28s ease;
    }

    /* Al abrir las redes, el mensaje principal sube un poco */
    .dialog-wrap.social-open {
      transform: translateY(clamp(-80px, -9vh, -40px));
    }

    .dialog {
      width: 100%;
      border-radius: 30px;
      overflow: hidden;
      background: #f1e8dd;
      box-shadow:
        0 0 0 3px #17141f,
        0 12px 28px rgba(0, 0, 0, 0.5);
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    /* Franja azul marino de arriba */
    .dialog-header {
      position: relative;
      height: 92px;
      background: linear-gradient(180deg, #424d79 0%, #3a4468 100%);
      border-top: 4px solid #5c6a98;
      border-bottom: 3px solid #272e4a;
    }

    /* Brillito en la esquina */
    .dialog-header::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 20px;
      width: 24px;
      height: 11px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      transform: rotate(-30deg);
      filter: blur(0.5px);
    }

    /* Cuerpo color crema */
    .dialog-body {
      min-height: 300px;
      padding: 48px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f1e8dd;
    }

    .dialog-text {
      font-size: clamp(28px, 5.4vw, 48px);
      font-weight: 800;
      line-height: 1.25;
      color: #5a4538;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
    }

    /* Franja beige de abajo (sin botón) */
    .dialog-footer {
      height: 84px;
      background: #d9cdc4;
      border-bottom: 9px solid #bcaea4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Flecha hacia abajo (usa el mismo estilo del botón de perfil) */
    .dialog-footer .down-btn {
      margin: 0;
      width: 52px;
      height: 52px;
    }

    .dialog-footer .down-btn svg {
      width: 24px;
      height: 24px;
    }

    .dialog-wrap.social-open .down-btn svg {
      transform: rotate(180deg);
    }

    /* ===== Mensaje de redes sociales (más angosto) ===== */
    .social-dialog {
      position: absolute;
      top: calc(100% + 22px);
      left: 50%;
      width: min(430px, 100%);
      transform: translate(-50%, -16px);
      opacity: 0;
      visibility: hidden;
      transition: transform 0.28s ease, opacity 0.25s ease, visibility 0.28s;
    }

    .dialog-wrap.social-open .social-dialog {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
    }

    .social-dialog .dialog-header {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
    }

    .social-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.55);
    }

    .social-dialog .dialog-body {
      min-height: 0;
      padding: 16px 14px;
      gap: 9px;
      flex-wrap: wrap;
    }

    .social-dialog .dialog-footer {
      height: 26px;
    }

    .social-link {
      display: block;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      box-shadow: 0 0 0 3px #3a2f29, 0 3px 5px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .social-link svg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 11px;
    }

    .social-link:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.1);
    }

    .social-link:active {
      transform: scale(0.94);
    }

    /* ===== Easter egg: personaje + globo de diálogo ===== */
    .egg {
      position: fixed;
      right: 22px;
      bottom: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      visibility: hidden;
    }

    .egg.show {
      visibility: visible;
    }

    .egg-bubble {
      position: relative;
      margin-bottom: 24px;
      padding: 14px 32px 20px;
      background: #ffffff;
      border: 3px solid #1b1b1f;
      border-radius: 28px;
      box-shadow:
        inset 0 -9px 0 #c4c4c8,
        0 4px 8px rgba(0, 0, 0, 0.3);
      font-size: 32px;
      font-weight: 800;
      color: #3b2f2a;
      white-space: nowrap;
      transform: scale(0);
      transform-origin: 50% 100%;
    }

    /* Colita del globo */
    .egg-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -17px;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      background: #ffffff;
      border-right: 3px solid #1b1b1f;
      border-bottom: 3px solid #1b1b1f;
      border-radius: 0 0 8px 0;
      transform: rotate(45deg) skew(8deg, 8deg);
    }

    .egg-char {
      display: block;
      width: 320px;
      height: auto;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35));
      transform: translateY(130%);
      opacity: 0;
    }

    .egg.show .egg-char {
      animation: eggIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }

    .egg.show .egg-bubble {
      animation: bubblePop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1) 0.4s forwards;
    }

    .egg.show.leaving .egg-char {
      animation: eggOut 0.4s ease-in forwards;
    }

    .egg.show.leaving .egg-bubble {
      animation: bubbleOut 0.25s ease-in forwards;
    }

    @keyframes eggIn {
      0%   { transform: translateY(130%); opacity: 0; }
      60%  { transform: translateY(-8%); opacity: 1; }
      80%  { transform: translateY(3%); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes eggOut {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(130%); opacity: 0; }
    }

    @keyframes bubblePop {
      0%   { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes bubbleOut {
      0%   { transform: scale(1); }
      100% { transform: scale(0); }
    }

    /* Móvil: abajo al centro */
    @media (max-width: 520px) {
      .egg {
        right: auto;
        left: 50%;
        margin-left: -150px;
        width: 300px;
      }
      .egg-char { width: 230px; }
      .egg-bubble { font-size: 26px; padding: 12px 26px 18px; }
    }

    /* ===== Mensaje "Acerca de" (con botón OK y fondo oscuro) ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0);
      visibility: hidden;
      transition: background 0.25s ease, visibility 0s linear 0.4s;
    }

    .modal-overlay.show {
      visibility: visible;
      background: rgba(0, 0, 0, 0.6);
      transition: background 0.25s ease, visibility 0s;
    }

    .modal-dialog {
      width: min(620px, 100%);
      transform: scale(0);
      opacity: 0;
    }

    .modal-dialog .dialog-body {
      min-height: 240px;
    }

    .modal-overlay.show .modal-dialog {
      animation: jumpIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .modal-overlay.hiding .modal-dialog {
      animation: jumpOut 0.38s ease-in forwards;
    }

    /* Aparece "saltando" */
    @keyframes jumpIn {
      0%   { transform: translateY(50px) scale(0.5); opacity: 0; }
      50%  { transform: translateY(-26px) scale(1.06); opacity: 1; }
      72%  { transform: translateY(6px) scale(0.98); opacity: 1; }
      88%  { transform: translateY(-6px) scale(1.01); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Desaparece "saltando" */
    @keyframes jumpOut {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      35%  { transform: translateY(-24px) scale(1.05); opacity: 1; }
      100% { transform: translateY(60px) scale(0.5); opacity: 0; }
    }

    /* Botón verde OK */
    .ok-btn {
      position: relative;
      width: 150px;
      height: 56px;
      padding: 0;
      cursor: pointer;
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      -webkit-text-stroke: 5px #2c3a2a;
      paint-order: stroke fill;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      background: linear-gradient(180deg, #9ce63c 0%, #74c91c 55%, #5fb214 100%);
      border: 3px solid #36452f;
      border-radius: 999px;
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.45),
        inset 0 -5px 0 rgba(0, 0, 0, 0.16),
        0 3px 5px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Brillo en la esquina del botón */
    .ok-btn::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 14px;
      width: 24px;
      height: 9px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .ok-btn:hover {
      filter: brightness(1.08);
    }

    .ok-btn:active {
      transform: scale(0.94);
    }

    @media (max-width: 520px) {
      .dialog-header { height: 60px; }
      .dialog-body { padding: 32px 22px; min-height: 220px; }
      .dialog-footer { height: 56px; }
    }

    @media (max-width: 520px) {
      .avatar-wrap { width: 64px; height: 64px; }
      .profile-title { font-size: 16px; gap: 6px; }
      .profile-title svg { width: 24px; height: 24px; }
      .profile-name { font-size: 18px; }
      .profile-main { gap: 10px; padding-right: 12px; }
      .expand-btn { width: 30px; height: 30px; margin-left: 2px; }
      .expand-btn svg { width: 14px; height: 14px; }

      /* --- Móvil: la flecha apunta abajo y el ID sale por debajo del perfil --- */
      .profile-card {
        flex-direction: column;
        align-items: stretch;
      }

      .profile-main .expand-btn svg {
        transform: rotate(90deg); /* flecha hacia abajo */
      }

      .profile-card.open .profile-main .expand-btn svg {
        transform: rotate(-90deg); /* flecha hacia arriba para ocultar */
      }

      .profile-extra {
        max-width: none;
        max-height: 0;
        margin-left: 0;
        margin-top: -16px;
        transition: max-height 0.3s ease, opacity 0.25s ease;
      }

      .profile-card.open .profile-extra {
        max-width: none;
        max-height: 90px;
      }

      .profile-extra-inner {
        height: 54px;
        padding: 12px 16px 0;
        justify-content: center;
        border: 3px solid #7f95b5;
        border-top: none;
        border-radius: 0 0 16px 16px;
      }
      .profile-id { font-size: 17px; }
    }
  </style>
</head>
<body>
  <!-- Fondo de la página -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

  <!-- Aquí iremos armando House Cookie paso por paso -->

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const sideMenu = document.getElementById('sideMenu');

    function toggleMenu(forceState) {
      const open = typeof forceState === 'boolean'
        ? forceState
        : !sideMenu.classList.contains('open');
      sideMenu.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
    }

    menuBtn.addEventListener('click', () => toggleMenu());

    // Cerrar con Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') toggleMenu(false);
    });

    /* ===== Mensaje "Acerca de" ===== */
    const aboutItem = document.getElementById('aboutItem');
    const aboutModal = document.getElementById('aboutModal');
    const okBtn = document.getElementById('okBtn');
    let modalBusy = false;

    function openAbout() {
      if (modalBusy || aboutModal.classList.contains('show')) return;
      toggleMenu(false); // cierra el menú lateral
      aboutModal.classList.remove('hiding');
      aboutModal.classList.add('show');
      aboutModal.setAttribute('aria-hidden', 'false');
      okBtn.focus({ preventScroll: true });
    }

    function closeAbout() {
      if (modalBusy || !aboutModal.classList.contains('show')) return;
      modalBusy = true;
      aboutModal.classList.add('hiding');
      aboutModal.classList.remove('show');
      aboutModal.setAttribute('aria-hidden', 'true');
      setTimeout(() => {
        aboutModal.classList.remove('hiding');
        modalBusy = false;
      }, 400);
    }

    aboutItem.setAttribute('role', 'button');
    aboutItem.setAttribute('tabindex', '0');
    aboutItem.addEventListener('click', openAbout);
    aboutItem.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openAbout();
      }
    });
    okBtn.addEventListener('click', closeAbout);

    /* ===== Perfil ===== */

    // Foto: intenta perfil.png y luego perfil.jpg
    const avatarImg = document.getElementById('avatarImg');
    const avatarSources = ['perfil.png', 'perfil.jpg'];
    let avatarIndex = 0;

    function loadNextAvatar() {
      if (avatarIndex < avatarSources.length) {
        avatarImg.style.display = 'block';
        avatarImg.src = avatarSources[avatarIndex++];
      } else {
        avatarImg.style.display = 'none'; // se queda el fondo placeholder
      }
    }
    avatarImg.addEventListener('error', loadNextAvatar);
    loadNextAvatar();

    // Easter egg: clic/toque en la foto de perfil
    const egg = document.getElementById('egg');
    const avatarWrap = document.querySelector('.avatar-wrap');
    let eggBusy = false;

    const EGG_CLICKS = 15;      // clics/toques seguidos necesarios
    const EGG_MAX_GAP = 2000;   // máximo 2 segundos entre cada clic
    let eggCount = 0;
    let eggResetTimer = null;

    function showEgg() {
      eggBusy = true;
      eggCount = 0;
      clearTimeout(eggResetTimer);
      egg.classList.remove('leaving');
      egg.classList.add('show');

      // Se queda 4 segundos y luego se va
      setTimeout(() => {
        egg.classList.add('leaving');
        setTimeout(() => {
          egg.classList.remove('show', 'leaving');
          eggBusy = false;
        }, 450);
      }, 4000);
    }

    avatarWrap.addEventListener('click', () => {
      if (eggBusy) return;

      eggCount++;
      clearTimeout(eggResetTimer);

      if (eggCount >= EGG_CLICKS) {
        showEgg();
        return;
      }

      // Si pasan más de 2 segundos sin clic, se cancela y empieza de cero
      eggResetTimer = setTimeout(() => { eggCount = 0; }, EGG_MAX_GAP);
    });

    // Desplegar / ocultar el ID
    const profileCard = document.getElementById('profileCard');
    const expandBtn = document.getElementById('expandBtn');
    const profileExtra = document.getElementById('profileExtra');
    const profileId = document.getElementById('profileId');

    expandBtn.addEventListener('click', () => {
      const open = profileCard.classList.toggle('open');
      expandBtn.setAttribute('aria-expanded', String(open));
      profileExtra.setAttribute('aria-hidden', String(!open));
      profileId.tabIndex = open ? 0 : -1;
    });

    // Copiar el ID al portapapeles (sin mensajes)
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    profileId.addEventListener('click', () => copyText(profileId.textContent.trim()));

    /* ===== Fondo de la página ===== */
    // DÍA  (6:30 am a 6:30 pm, hora de México): bg.png o bg.jpg
    // NOCHE (6:30 pm a 6:30 am, hora de México): bg_night.png o bg_night.jpg
    // Si no existe la imagen que toca, se queda el verde #017C00
    const bgSets = {
      day:   ['bg.png', 'bg.jpg'],
      night: ['bg_night.png', 'bg_night.jpg']
    };
    const DAY_START = 6 * 60 + 30;    // 6:30 am
    const NIGHT_START = 18 * 60 + 30; // 6:30 pm

    // Minutos transcurridos del día en la Ciudad de México
    function getMexicoMinutes() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'America/Mexico_City',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
      const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
      return h * 60 + m;
    }

    function currentPeriod() {
      const t = getMexicoMinutes();
      return (t >= NIGHT_START || t < DAY_START) ? 'night' : 'day';
    }

    const bgLayer = document.getElementById('bgLayer');
    let appliedPeriod = null;
    let bgToken = 0;

    function applyBackground(period) {
      appliedPeriod = period;
      const token = ++bgToken;
      const sources = bgSets[period];

      (function tryLoad(i) {
        if (token !== bgToken) return; // llegó un cambio más nuevo
        if (i >= sources.length) {
          bgLayer.style.backgroundImage = 'none'; // se queda #017C00
          return;
        }
        const img = new Image();
        img.onload = () => {
          if (token === bgToken) {
            bgLayer.style.backgroundImage = 'url("' + sources[i] + '")';
          }
        };
        img.onerror = () => tryLoad(i + 1);
        img.src = sources[i];
      })(0);
    }

    function checkBackground() {
      const period = currentPeriod();
      if (period !== appliedPeriod) applyBackground(period);
    }

    checkBackground();
    setInterval(checkBackground, 30000); // revisa cada 30 segundos
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkBackground();
    });

    /* ===== Redes sociales ===== */
    const dialogWrap = document.getElementById('dialogWrap');
    const socialBtn = document.getElementById('socialBtn');
    const socialDialog = document.getElementById('socialDialog');

    socialBtn.addEventListener('click', () => {
      const open = dialogWrap.classList.toggle('social-open');
      socialBtn.setAttribute('aria-expanded', String(open));
      socialDialog.setAttribute('aria-hidden', String(!open));
    });
  </script>
