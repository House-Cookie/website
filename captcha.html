<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación | House Cookie</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="shortcut icon" href="favicon.ico">

  <style>
    /* Fuente personalizada (font.ttf junto al aviso.html) */
    @font-face {
      font-family: "HouseFont";
      src: url("font.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Ancho del mensaje (se adapta al tamaño de la pantalla) */
      --w: min(820px, 92vw, calc((100vh - 40px) / 1.34));
      --u: calc(var(--w) / 820); /* unidad: todo el mensaje escala con el ancho */
    }

    /* Navegadores modernos de celular: usa el alto real visible */
    @supports (height: 100dvh) {
      :root {
        --w: min(820px, 92vw, calc((100dvh - 40px) / 1.34));
      }
    }

    html, body {
      height: 100%;
      overflow: hidden; /* la página queda fija, sin scroll */
    }

    body {
      height: 100vh;
      height: 100dvh;
      background-color: #017C00; /* Respaldo si no hay bg.png / bg.jpg */
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: "HouseFont", "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    }

    /* ===== Escenario ===== */
    .stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Espacio arriba para que quepa la cabeza del personaje */
      padding: calc(var(--w) * 0.697) 0 0;
    }

    .wrap {
      position: relative;
      width: var(--w);
    }

    /* ===== Personaje asomándose detrás del mensaje ===== */
    .peek {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 8px); /* se mete un poquito detrás del cuadro */
      width: calc(100% * 1.08);  /* más grande que el cuadro */
      aspect-ratio: 704 / 454;   /* 454 = 58% del alto de la imagen (783px) */
      transform: translateX(-50%);
      overflow: hidden;          /* solo se ve la parte de arriba (la cabeza) */
      z-index: 0;
      pointer-events: none;
    }

    .peek img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.3));
    }

    /* ===== Mensaje ===== */
    .dialog {
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: #f1e8dd;
      box-shadow:
        0 0 0 3px #17141f,
        0 14px 32px rgba(0, 0, 0, 0.5);
    }

    /* Franja azul marino de arriba */
    .dialog-header {
      position: relative;
      height: calc(var(--u) * 104);
      background: linear-gradient(180deg, #424d79 0%, #3a4468 100%);
      border-top: 4px solid #5c6a98;
      border-bottom: 3px solid #272e4a;
    }

    /* Brillito en la esquina */
    .dialog-header::after {
      content: "";
      position: absolute;
      top: 14px;
      left: 24px;
      width: 28px;
      height: 13px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      transform: rotate(-30deg);
      filter: blur(0.5px);
    }

    /* Cuerpo color crema */
    .dialog-body {
      height: calc(var(--u) * 320);
      padding: 0 calc(var(--u) * 48);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f1e8dd;
    }

    .dialog-text {
      font-size: clamp(22px, calc(var(--u) * 54), 54px);
      font-weight: 800;
      line-height: 1.25;
      color: #5a4538;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
    }

    /* Contenedor del captcha de Cloudflare (se escala con el tamaño del mensaje) */
    .captcha-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 300px;
      height: 65px;
      transform-origin: center center;
    }

    .dialog-noscript {
      font-size: 18px;
      font-weight: 800;
      color: #5a4538;
    }

    /* Franja beige de abajo (sin botón) */
    .dialog-footer {
      height: calc(var(--u) * 96);
      background: #d9cdc4;
      border-bottom: calc(var(--u) * 10) solid #bcaea4;
    }

    @media (max-width: 520px) {
      .dialog { border-radius: 26px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="wrap">
      <!-- Personaje: solo se ve la cabeza, detrás del mensaje -->
      <div class="peek" aria-hidden="true">
        <img src="yo.png" alt="" onerror="this.style.display='none'">
      </div>

      <section class="dialog">
        <div class="dialog-header"></div>
        <div class="dialog-body">
          <!-- Captcha de Cloudflare (Turnstile) -->
          <div class="captcha-box" id="captchaBox">
            <!--
              data-sitekey: aquí va TU "Site key" de Turnstile (ver instrucciones).
              El valor 1x00000000000000000000AA es la llave de PRUEBA de Cloudflare:
              siempre pasa y funciona en cualquier dominio. Cámbiala por la tuya.
            -->
            <div class="cf-turnstile"
                 data-sitekey="1x00000000000000000000AA"
                 data-theme="light"
                 data-language="es"
                 data-callback="onCaptchaSuccess"></div>
          </div>
          <noscript><p class="dialog-noscript">Activa JavaScript para completar la verificación.</p></noscript>
        </div>
        <div class="dialog-footer"></div>
      </section>
    </div>
  </main>

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <script>
    /* ===== Captcha: se agranda junto con el mensaje ===== */
    const captchaBox = document.getElementById('captchaBox');
    const dialogEl = document.querySelector('.dialog');

    function scaleCaptcha() {
      // 1x en pantallas chicas, hasta 2x cuando el mensaje es grande
      const s = Math.max(1, Math.min(2, dialogEl.getBoundingClientRect().width / 410));
      captchaBox.style.transform = 'scale(' + s.toFixed(3) + ')';
    }
    scaleCaptcha();
    window.addEventListener('resize', scaleCaptcha);

    /* A dónde mandar a la persona después de verificarse.
       El Worker la trae aquí con ?next=/pagina-que-quería-abrir */
    function getNext() {
      const raw = new URLSearchParams(window.location.search).get('next') || '/';
      // solo rutas internas (evita redirecciones a otros sitios)
      if (!raw.startsWith('/') || raw.startsWith('//') || raw.startsWith('/\\') ||
          raw.startsWith('/captcha.html') || raw.startsWith('/__verify')) return '/';
      return raw;
    }

    /* Se ejecuta cuando la persona resuelve el captcha: manda el token al Worker,
       que lo valida con Cloudflare (con tu Secret key) y, si es bueno, deja una cookie. */
    async function onCaptchaSuccess(token) {
      try {
        const res = await fetch('/__verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          window.location.replace(getNext());
          return;
        }
      } catch (e) { /* sin conexión o sin Worker: se reintenta abajo */ }
      if (window.turnstile) window.turnstile.reset(); // pide el captcha de nuevo
    }

    /* ===== Fondo: solo bg.png o bg.jpg ===== */
    // Si no existe ninguno, se queda el verde #017C00
    const bgSources = ['bg.png', 'bg.jpg'];

    (function loadBackground(i) {
      if (i >= bgSources.length) return;
      const img = new Image();
      img.onload = () => {
        document.body.style.backgroundImage = 'url("' + bgSources[i] + '")';
      };
      img.onerror = () => loadBackground(i + 1);
      img.src = bgSources[i];
    })(0);
  </script>
</body>
</html>
